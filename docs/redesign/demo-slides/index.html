<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Closed-loop evaluation · Interactive Visual Gym</title><link rel="stylesheet" href="carousel.css"></head>
<body><nav class="review-nav"><a href="../">Interactive Visual Gym</a><a href="../leaderboard/">Leaderboard ↗</a></nav><main>
<section class="episode-carousel" aria-roledescription="carousel" aria-label="Recorded assistant episodes"><div class="carousel-stage">
 <button class="side-preview left-preview" aria-label="Previous episode"><span class="preview-title"></span><canvas width="640" height="360"></canvas><span class="page-direction">← Previous</span></button>
 <article class="episode-card" id="episode-card" aria-roledescription="slide">
  <header class="task-heading"><h1 id="engine">CookSim simulator</h1><p><strong>Example task</strong> <span id="task"></span></p></header>
  <div class="presentation"><section class="film" aria-label="Episode playback"><div class="video-stage">
   <div class="views"><figure><canvas id="world" width="640" height="480"></canvas><figcaption id="world-label">Top-down</figcaption></figure><figure><canvas id="ego" width="640" height="480"></canvas><figcaption id="ego-label">Egocentric</figcaption></figure></div>
   <div class="dialogue-stage"><div class="speech"><div class="speaker"><b id="speaker-name">Assistant</b><span id="speaker-detail"></span><span class="speaking" aria-hidden="true"><i></i><i></i><i></i></span></div><div class="utterance" id="utterance"></div></div></div>
   <button class="start" id="start" aria-label="Play episode">▶</button></div>
   <div class="progress-band"><div class="band-label">Task progress <div class="event-legend" aria-label="Scheduled event types"><span class="question"><i></i>Question / request</span><span><i></i>Mistake</span></div><span id="tick">Tick 0</span></div><div id="milestones" class="milestones"></div><div class="event-track" id="events" aria-label="Scheduled events"></div><div class="event-status"><span class="event-key"><i></i> Scheduled event</span><span id="event-status">—</span></div></div>
   <div class="playback"><button id="play" aria-label="Play episode">▶</button><input id="seek" type="range" min="0" max="1" step=".01" value="0" aria-label="Video position"><span id="timestamp">0:00</span><button id="mute" aria-label="Mute audio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9H7L12 5V19L7 15H3Z"/><path d="M16 8Q20 12 16 16M19 5Q25 12 19 19" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button><button id="fullscreen" aria-label="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V3H9M15 3H21V9M21 15V21H15M9 21H3V15" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button></div>
  </section><aside class="scores" aria-label="Full-episode evaluation"><h2>Evaluation score</h2><div id="scores"></div></aside></div>
 </article>
 <button class="side-preview right-preview" aria-label="Next episode"><span class="preview-title"></span><canvas width="640" height="360"></canvas><span class="page-direction">Next →</span></button>
</div><div class="episode-navigation"><button id="previous" aria-label="Previous simulator"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M20 6 10 16l10 10"/></svg></button><div id="episode-tabs" role="tablist" aria-label="Choose simulator"></div><button id="next" aria-label="Next simulator"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m12 6 10 10-10 10"/></svg></button></div>
<p class="media-note">Recorded interactions · Synthetic voices · Playback time adjusted for narration</p><p id="score-note" class="score-note"></p>
</section></main><div id="media-sources" hidden></div><script type="module" src="carousel.js"></script></body></html>
